include colors.conf

background_opacity         0.8
dynamic_background_opacity yes

font_family Iosevka NF
font_size 14

shell zsh

window_margin_width 5

# Enable mouse support
mouse_enabled yes

# Map scroll wheel to terminal scrolling (not history)
mouse_map scroll_up    scroll_line_up
mouse_map scroll_down  scroll_line_down

# Optional: Map shift+scroll for faster scrolling
mouse_map shift+scroll_up    scroll_page_up
mouse_map shift+scroll_down  scroll_page_down

# Disable any kitty-specific scroll behavior that might conflict
enable_audio_bell no
